# How the testbed tests, checks, builds and deploys this repository, in the testbed's declaration format.
# The Cargo suite is the workspace's; the bun suite is the owner's reader in `reader/`.

testbed = 0
name = "telegram"

[test]
languages = ["cargo", "bun"]
setup = ["cd reader && bun install --frozen-lockfile"]

# The provider's hosted tool, found by its tool.toml and checked by the command the manifest names.
[tools]
dir = "tools"

[check]
quick = ["layout", "dependencies", "cargo-profile", "shared-versions", "personal-data"]
base_libraries = ["bmo-chat", "bmo-chat-client", "bmo-ui"]

# The repository whose root holds the shared versions the manifests and the lock hold to.
[check.shared_versions]
repository = "bmo-chat"

[check.shared_versions.exceptions.reqwest]
reason = "A file goes up to the Bot API as a multipart form, which reqwest's multipart feature builds; the shared line has no multipart body."
line = 'reqwest = { version = "0.13.5", features = ["json", "multipart", "query", "stream"] }'

# No Cargo static step is declared. The testbed's own Cargo workspace check formats and lints every member,
# every target compiled, through its Cargo verb in the shared build directory wherever a change marks a crate,
# and the change check compiles every crate a change marks; a change that marks none has no Rust to judge. The
# reader's type check is declared because nothing else reaches it.

[[check.step]]
id = "reader-types"
command = "./node_modules/.bin/tsc --noEmit"
dir = "reader"
when = ["reader/**", "policy/**"]

[build]
# The service's binary and the hosted tool's executable; the reader is a bun package run from the release's
# reader/, which the setup steps install, not a Cargo binary.
binaries = ["bmo-telegram", "messages-tool"]

# The provider's deploy tree, and the data root it shares with the services that read its files. The env file
# both processes read is linked into the release (docs/boundary-api.md, 「Configuration」); the service's unit
# carries the bot mark and the reader's the restart mark.
[deploy]
root = "~/.local/share/bmo-telegram"
link = "deploy"
data_root = "~/.local/share/bmo/data"
env_links = [{ link = "telegram.env", target = "env/telegram.env" }]
units = ["deploy/*.service"]
# Answers 0 once the service's own /health says ready, in the environment the release links.
health = "set -a; . ~/.local/share/bmo-telegram/deploy/telegram.env; ~/.local/share/bmo-telegram/deploy/bin/bmo-telegram health"

# The tool placed in its folder's .placed/, the folder the tool host reads: the executable the release's bin/
# holds, its manifest, the schema and the manual beside it.
[[deploy.step]]
id = "place-tools"
phase = "before-flip"
command = '''
set -eu
rm -rf "tools/messages/.placed"
mkdir -p "tools/messages/.placed"
cp "bin/messages-tool" "tools/messages/tool.toml" "tools/messages/messages.json" "tools/messages/manual.md" "tools/messages/.placed/"
'''

# The placed tool registered with the tool host under this service's name, so every release carries it without
# a hand on the registry and an entry a release no longer holds leaves the catalogue with it.
[[deploy.step]]
id = "register-tools"
phase = "after-health"
command = '''
set -eu
put="$HOME/.local/share/bmo-pocket/deploy/bin/bmo-pocket"
"$put" put --service telegram --placed --allow room.tools tools/messages/.placed
'''

# This service's standing line in every agent's brain, declared once the service is up (the brain's
# docs/boundary-api.md, 「Declarations and holders」); a machine with no brain passes.
[[deploy.step]]
id = "holder-declare"
phase = "after-health"
command = '''
set -eu
brain="$HOME/.local/share/bmo-brain/deploy/bin/bmo-brain"
[ -x "$brain" ] || exit 0
"$brain" holder declare deploy/brain-holder.toml
'''
