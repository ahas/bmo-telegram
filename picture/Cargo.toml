[package]
name = "telegram-picture"
description = "A picture read and redrawn for Telegram: its type, its transparency, an upload Telegram takes as a photo, and a picture kept inside its size."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
# One test target, the harness at tests/main.rs (bmo-chat's docs/conventions.md, 「Rust builds」).
autotests = false

[dependencies]
avif-parse.workspace = true
image.workspace = true
rav1d.workspace = true
resvg.workspace = true
thiserror.workspace = true
yuv.workspace = true

[[test]]
name = "main"
path = "tests/main.rs"
