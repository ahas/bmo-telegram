# The Telegram provider's fixed values and English words (docs/telegram.md): what it declares, how it reads
# what Telegram answers, the reasons it refuses a send with, how it handles a picture, what it names a file
# with no name of its own, and the placeholder each kind of message is handed over as. A mark written as
# `{name}` is filled where the line is used; one that stands for an optional part carries its own lead space,
# so a part a message lacks leaves nothing behind. Telegram's own limits are the dialect's.

[telegram]
# What the platform is called where a person reads it.
label = "Telegram"
# What the provider can do. Fetching a picture on demand, avatars, history, the list of rooms, the contacts,
# starting a conversation, and hearing who is typing and who is online are the owner's account's, and stop
# being true where that mode is not active; a room's members the bot account tells on its own.
can = ["text", "photo", "album", "document", "audio", "voice", "sticker", "reaction", "pin", "typing", "edit", "delete", "replyTo", "fetchMedia", "avatars", "history", "roomList", "contactList", "memberList", "startChat", "startGroup", "peopleTyping", "presence"]
# The modes an answer cannot be pinned to a message of: what the owner's account read, the bot did not see.
# How Telegram describes a message not there to act on — deleted, never sent, or past the time it could be
# changed — read without regard to case. Asking again would get the same answer.
gone_descriptions = ["message to \\w+ not found", "MESSAGE_ID_INVALID", "message can't be (edited|deleted)"]
# How Telegram describes an edit to the words the message already says, which is no failure.
unchanged_description = "message is not modified"
# How Telegram describes a voice's caption it will not take — markup it cannot read, or one too long — read
# without regard to case; the voice then goes again with its reading as messages under it.
caption_refused_descriptions = ["parse entities", "caption.*too long"]

# The provider's own reasons, each the detail of a `platform` refusal.
[refusals]
# An act on a message Telegram no longer has, marked gone: {why} is Telegram's own description of it.
message_gone = "Telegram can no longer act on that message: {why}"
# A sticker the configured set does not carry: {set} and {emoji}.
sticker_missing = "The sticker set {set} has no sticker for {emoji}."
# A sticker asked for where no sticker set is configured.
sticker_unset = "No sticker set is configured."
# A send asked to be spoken in a {mode} that is not running, {why}, or in a mode the provider does not read
# by.
mode_down = "Telegram's {mode} mode is not running: {why}."
mode_missing = "Telegram does not read by that mode"
# A send in the owner's own account of a {verb} it does not carry: it takes words, files, the typing mark, a
# delete, a reaction, a pin and an edit alone.
owner_verb = "The owner's own account sends only text, photos, albums, documents, audio, the typing mark, deletes, reactions, pins and edits, not {verb}."
# A reaction or a pin, the {verb}, in the avatar's voice: it carries no words, so nothing could mark it as the
# agent's rather than the owner's own.
avatar_unmarked = "A {verb} in the avatar's voice would carry no mark of the agent and read as the owner's own, so the owner's account does not make it."
# An edit in the avatar's voice: the account cannot tell a line the avatar sent from one the owner typed.
avatar_edit = "An edit in the avatar's voice could put the agent's words into a line the owner typed, so the owner's account does not make it."
# An act in the owner's account on a number the provider cannot line up with a line of that account: the
# ledger holds it under both accounts' numbering, or not at all in a room the bot account reads.
line_unknown = "The provider cannot tell which line of the owner's account that number names"
# An edit in the owner's voice of a line someone else sent: only its sender may change it.
not_own_line = "The message is not the owner's own, so his account cannot edit it."
# A typing send in the bot's voice that names an account: that account's typing, which only its own Telegram
# account could show, and the provider holds none of it.
typing_account = "Telegram shows typing only as the bot, for the answerer, or in the owner's own account; the provider holds no Telegram account of the account this typing is for."
# A send into a room the bot is not in, in any voice but the owner's own, or in the avatar's where the room is not
# added: such a room is the owner's account's alone.
read_only = "The bot is not in this room: it is the owner's account's alone, and takes only the owner's own words, and the avatar's once the room is added."

# A picture: the placeholder a picture message with no caption is handed over as, why one did not go, and how
# one is redrawn. A picture named by something that is neither a web address nor a file under the picture
# root, or by a file that is not there, is missed by bmo-chat's own codes, which carry their own sentences.
[pictures]
mark = "[Photo]"
# Telegram refused it without saying why, or the last try failed with {fault}; and a picture left out of an
# album that went, because it could not be fetched or was no picture.
refused = "Telegram did not take it."
failed = "It could not be sent: {fault}"
left_out = "It was left out of the album: it could not be fetched or is no picture."
# The JPEG quality a picture redrawn for an upload is written at.
upload_quality = 90
# How a picture is kept for the receiver: one past this many bytes, or one with transparency, is brought
# inside this many pixels on its longer side, laid on white and written as JPEG at this quality.
kept_threshold_bytes = 4000000
kept_max_dimension = 1568
kept_quality = 80

# A send in the owner's own account: the largest file it carries, which is what one hop of a send can carry
# rather than what Telegram would take, and why a file is left out before anything goes — it holds nothing, or
# it is past that ceiling, {size} its own size and {largest} the ceiling's, each written as `megabytes` writes
# {megabytes}.
[owner]
largest_bytes = 52428800
empty_file = "{name}: the file is empty, so it was not sent."
too_large = "{name}: {size} is too large; one file can be at most {largest}."
megabytes = "{megabytes} MB"

# The agent's words in the owner's account, the `human-avatar` voice: the prefix they carry where neither the
# send nor the deployment names one, so a reader of the room tells them from the owner's own.
[avatar]
prefix = "🤖 "

# A person's typing as the owner's account hears it: how long a mark stands unless Telegram tells it again, which
# Telegram does every few seconds while the person goes on.
[typing]
lasts_ms = 6000

# What the provider gathers of a message.
[gathering]
# Why a file that could not be kept is handed over as not kept.
file_not_kept = "The file could not be kept."
# The largest body the reader's seam takes in one hand-over. A gathered file crosses whole as base64 in JSON, a
# third larger than its bytes, and the receiver keeps a file of up to 25 MiB, so the seam takes 48 MiB.
seam_body_bytes = 50_331_648
# A sound with no name of its own: a note somebody spoke, or a sound file they attached, with the extension
# its type implies.
voice_name = "voice"
sound_name = "briefing"
# A video with no name of its own is named for which it was, with the extension its type implies, or the
# fallback.
video_name = "video"
video_note_name = "video-note"
gif_name = "gif"
video_fallback_extension = ".mp4"

[gathering.audio_extensions]
"audio/ogg" = ".ogg"
"audio/mpeg" = ".mp3"
"audio/mp4" = ".m4a"
"audio/x-m4a" = ".m4a"
"audio/wav" = ".wav"
"audio/x-wav" = ".wav"
"audio/flac" = ".flac"
"audio/aac" = ".aac"
"audio/webm" = ".webm"
"audio/opus" = ".opus"

[gathering.video_extensions]
"video/mp4" = ".mp4"
"video/webm" = ".webm"
"video/quicktime" = ".mov"

# What a message that is not plain text is handed over as, by its kind, followed by its {caption} where it
# has one: a forward {from} somebody or some chat, the {duration} of a sound or a video, a place by its
# {latitude} and {longitude}, a contact's {name} and {phone}, a poll's {question} and {options}, a sticker's
# {emoji} and {set}, a dice roll's {emoji} and its {value}, an audio or a document by its {name}, who joined or
# left, and what was pinned or what the room was renamed to.
[kinds]
forwarded = "[Forwarded from {from}] "
forwarded_bare = "[Forwarded] "
forwarded_chat = "a chat"
photo = "[Photo]{caption}"
location = "[Location] latitude {latitude}, longitude {longitude}{live} https://maps.google.com/?q={latitude},{longitude}"
location_live = ", shared live"
venue = "[Venue] {title}, {address} https://maps.google.com/?q={latitude},{longitude}"
contact = "[Contact] {name} {phone}"
poll = "[Poll] {question} ({options})"
dice = "[{emoji} {value}]"
sticker = "[Sticker{emoji}{set}]"
sticker_set = " ({set})"
video = "[Video{duration}]{caption}"
video_note = "[Video note{duration}]"
gif = "[GIF{duration}]"
voice = "[Voice{duration}]{caption}"
audio = "[Audio{name}{duration}]{caption}"
document = "[File{name}]{caption}"
# The name a file with none of its own stands under in its placeholder.
unnamed_file = "attachment"
story = "[Story]"
paid_media = "[Paid media]{caption}"
giveaway = "[Giveaway]"
joined = "[Joined] {members}"
left = "[Left] {member}"
pinned = "[Pinned] {text}"
pinned_message = "message {id}"
renamed = "[Room renamed] {title}"
photo_changed = "[Room photo changed]"
photo_deleted = "[Room photo removed]"
call_started = "[Video call started]"
call_ended = "[Video call ended{duration}]"
