# The workspace: the Telegram provider service's own package at the root, and the crates it is built from, each
# in a folder of its own and named as a member as it stands. The root package also holds the checks that span
# the repository and the service's integration tests in `tests/`. The owner's reader in `reader/` is a bun
# package, outside the workspace.
[workspace]
members = ["dialect", "picture"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
async-trait = "0.1.92"
avif-parse = "2.1.0"
clap = { version = "4.5.40", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }
axum = { version = "0.8.4", default-features = false, features = ["http1", "json", "tokio"] }
bmo-chat = { path = "../../base/chat/provider" }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "gif", "webp", "tiff", "avif"] }
mime_guess = "2.0.5"
rand = "0.9.2"
rav1d = { version = "1.1.0", default-features = false, features = ["bitdepth_8", "bitdepth_16"] }
regex = "1.11.1"
# The Bot API is HTTPS, and a file goes up to it as a multipart form.
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "multipart"] }
resvg = "0.48.1"
serde = { version = "1.0.219", features = ["derive"] }
# Telegram's own payload crosses as metadata in the order Telegram wrote it.
serde_json = { version = "1.0.138", features = ["preserve_order"] }
sha2 = "0.10.9"
strum = "0.28.0"
telegram-dialect = { path = "dialect" }
telegram-picture = { path = "picture" }
thiserror = "2.0.18"
tokio = "1.53.2"
toml = { version = "0.8.23", default-features = false, features = ["parse"] }
unicode-segmentation = "1.12.0"
url = "2.5.8"
yuv = "0.8.19"

[package]
name = "bmo-telegram"
description = "The Telegram chat provider: the bot account, the owner's reader behind it, and the telegram-html dialect."
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
async-trait.workspace = true
axum.workspace = true
bmo-chat.workspace = true
# The service binary's verbs.
clap.workspace = true
# A file's kind read off its name where none came with it, and the sticker picked among those of a feeling.
mime_guess.workspace = true
rand.workspace = true
regex.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
sha2.workspace = true
telegram-dialect.workspace = true
telegram-picture.workspace = true
tokio = { workspace = true, features = ["fs", "sync", "time", "rt", "net", "signal", "macros"] }
toml.workspace = true
url.workspace = true

[dev-dependencies]
# The repository checks read `cargo metadata`, the testbed's declaration and the reader's manifest; the
# policy's test counts bmo-chat's capabilities; the seam's tests serve fakes of the reader and the receiver;
# the sends' stand-in of the Bot API reads the forms a file goes up in.
axum = { workspace = true, features = ["multipart"] }
image.workspace = true
strum.workspace = true
# The served service's tests keep the reader's profile pictures in a folder of their own.
tempfile = "3.20.0"
tokio = { workspace = true, features = ["macros", "net", "rt", "sync"] }
