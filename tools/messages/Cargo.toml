[package]
name = "messages-tool"
description = "Read one chat's recent messages through the running provider, on the owner's word alone."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "messages-tool"
path = "src/main.rs"
test = false

[dependencies]
# The provider's token and loopback port, read from the env file under the data root.
dotenvy.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true

[dev-dependencies]
axum.workspace = true
tempfile = "3.20.0"

[[test]]
name = "main"
path = "tests/main.rs"
